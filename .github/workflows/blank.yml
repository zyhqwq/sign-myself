name: Skland Auto Signin

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.9'

jobs:
  signin:
    runs-on: ubuntu-latest
    # 移除 environment: Configure TOKEN 这一行
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests cryptography
        
    - name: Run Skland Signin
      env:
        TOKEN: ${{ secrets.TOKEN }}
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        DEVICE_MODE: ${{ secrets.DEVICE_MODE || 'smart' }}
        FIXED_DEVICE_ID: ${{ secrets.FIXED_DEVICE_ID }}
      run: python skland_signin.py
        
    - name: Upload logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: signin-logs
        path: logs/