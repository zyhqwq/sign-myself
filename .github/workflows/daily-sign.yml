name: Daily Sign

on:
  schedule:
    # 每天北京时间凌晨3点25分运行（UTC时间19点25分）
    - cron: '25 19 * * *'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests cryptography

    - name: Run Daily Sign
      env:
        SIGN_GAMES: ${{ secrets.SIGN_GAMES }}
        SKLAND_TOKEN: ${{ secrets.SKLAND_TOKEN }}
        MIYOUSHE_COOKIE: ${{ secrets.MIYOUSHE_COOKIE }}
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        BARK_URL: ${{ secrets.BARK_URL }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        CUSTOM_WEBHOOK_URL: ${{ secrets.CUSTOM_WEBHOOK_URL }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        SMTP_TO: ${{ secrets.SMTP_TO }}
        DEBUG_NOTIFY: ${{ secrets.DEBUG_NOTIFY }}
      run: |
        python sign_all.py
