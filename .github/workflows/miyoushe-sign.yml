name: Miyoushe Daily Sign

on:
  schedule:
    # 每天北京时间凌晨4点运行（UTC时间20点）
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Miyoushe Daily Sign
      env:
        MIYOUSHE_COOKIE: ${{ secrets.MIYOUSHE_COOKIE }}
        MIYOUSHE_GIDS: ${{ secrets.MIYOUSHE_GIDS }}
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        BARK_URL: ${{ secrets.BARK_URL }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        CUSTOM_WEBHOOK_URL: ${{ secrets.CUSTOM_WEBHOOK_URL }}
        DEBUG_NOTIFY: ${{ secrets.DEBUG_NOTIFY }}
      run: |
        python miyoushe_sign.py
