# .github/workflows/verify-token.yml
name: Verify Token Access

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: Configure TOKEN
    
    steps:
      - name: Check if TOKEN is accessible
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          echo "Token length: ${#TOKEN}"
          if [ -n "$TOKEN" ]; then
            echo "✅ TOKEN is accessible"
          else
            echo "❌ TOKEN is empty or not accessible"
            exit 1
          fi