name: Skland Daily Sign with Multiple Webhooks

on:
  schedule:
    # 每天早上6点运行（UTC时间22点，北京时间早上6点）
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  sign:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Debug environment variables
      run: |
        echo "检查环境变量配置..."
        echo "SKLAND_TOKEN is set: ${{ secrets.SKLAND_TOKEN != '' }}"
        echo "WECHAT_WEBHOOK_URL is set: ${{ secrets.WECHAT_WEBHOOK_URL != '' }}"
        echo "DISCORD_WEBHOOK_URL is set: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}"
        echo "TELEGRAM_BOT_TOKEN is set: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}"
        echo "TELEGRAM_CHAT_ID is set: ${{ secrets.TELEGRAM_CHAT_ID != '' }}"
        echo "FEISHU_WEBHOOK_URL is set: ${{ secrets.FEISHU_WEBHOOK_URL != '' }}"
        echo "BARK_URL is set: ${{ secrets.BARK_URL != '' }}"
        echo "PUSHPLUS_TOKEN is set: ${{ secrets.PUSHPLUS_TOKEN != '' }}"
        echo "SERVER_CHAN_KEY is set: ${{ secrets.SERVER_CHAN_KEY != '' }}"
        echo "CUSTOM_WEBHOOK_URL is set: ${{ secrets.CUSTOM_WEBHOOK_URL != '' }}"
      env:
        SKLAND_TOKEN: ${{ secrets.SKLAND_TOKEN }}
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        BARK_URL: ${{ secrets.BARK_URL }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        CUSTOM_WEBHOOK_URL: ${{ secrets.CUSTOM_WEBHOOK_URL }}
    
    - name: Run Skland Sign
      env:
        SKLAND_TOKEN: ${{ secrets.SKLAND_TOKEN }}
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        BARK_URL: ${{ secrets.BARK_URL }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        CUSTOM_WEBHOOK_URL: ${{ secrets.CUSTOM_WEBHOOK_URL }}
      run: |
        python arknight_github.py